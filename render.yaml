services:
  - type: web
    name: cosmos
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: COSMOS_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: '*'
